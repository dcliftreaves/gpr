<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">GPR four-pillar production readiness</title>
  <desc id="desc">Four product pillars for GPR: RAW stills 92 percent, GoPro RAW video MVP 80 percent, premium still SR 60 percent, and raw video reconstruction 100 percent, with PSF work parked as research.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .ink { fill: #101820; }
      .muted { fill: #536170; }
      .panel { fill: #ffffff; stroke: #d6dee8; stroke-width: 1; }
      .title { font: 800 32px system-ui, -apple-system, Segoe UI, sans-serif; fill: #101820; }
      .subtitle { font: 500 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #536170; }
      .label { font: 800 18px system-ui, -apple-system, Segoe UI, sans-serif; fill: #101820; }
      .small { font: 500 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #536170; }
      .num { font: 900 34px system-ui, -apple-system, Segoe UI, sans-serif; fill: #101820; }
      .badgeText { font: 800 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .track { fill: #e6edf3; }
      .stills { fill: #008a64; }
      .video { fill: #2067b1; }
      .premium { fill: #b45f06; }
      .recon { fill: #6f42c1; }
      .research { fill: #6b7280; }
    </style>
  </defs>
  <rect class="bg" width="1180" height="560"/>
  <text class="title" x="42" y="56">Four Product Pillars</text>
  <text class="subtitle" x="42" y="84">Ship decisions, blockers, and research parking for the current production branch.</text>

  <rect class="panel" x="42" y="122" width="258" height="270" rx="8"/>
  <rect class="stills" x="64" y="146" width="86" height="26" rx="13"/>
  <text class="badgeText" x="80" y="164">SHIP</text>
  <text class="label" x="64" y="206">RAW stills</text>
  <text class="num" x="64" y="250">92%</text>
  <rect class="track" x="64" y="276" width="206" height="16" rx="8"/>
  <rect class="stills" x="64" y="276" width="190" height="16" rx="8"/>
  <text class="small" x="64" y="318">50 MP tiers are locked.</text>
  <text class="small" x="64" y="340">Normal Bayer support is locked.</text>
  <text class="small" x="64" y="362">Mission/iPhone darkframes</text>
  <text class="small" x="64" y="384">close noise addback.</text>

  <rect class="panel" x="322" y="122" width="258" height="270" rx="8"/>
  <rect class="video" x="344" y="146" width="132" height="26" rx="13"/>
  <text class="badgeText" x="361" y="164">HANDOFF</text>
  <text class="label" x="344" y="206">GoPro RAW video MVP</text>
  <text class="num" x="344" y="250">80%</text>
  <rect class="track" x="344" y="276" width="206" height="16" rx="8"/>
  <rect class="video" x="344" y="276" width="165" height="16" rx="8"/>
  <text class="small" x="344" y="318">4K Bayer .gvid encode passes on Pi 5.</text>
  <text class="small" x="344" y="340">1024 preview decode passes on Pi 5.</text>
  <text class="small" x="344" y="362">Real sensor, SD, and display</text>
  <text class="small" x="344" y="384">receipts remain.</text>

  <rect class="panel" x="602" y="122" width="258" height="270" rx="8"/>
  <rect class="premium" x="624" y="146" width="126" height="26" rx="13"/>
  <text class="badgeText" x="641" y="164">DO NOT SHIP</text>
  <text class="label" x="624" y="206">Premium still/SR</text>
  <text class="num" x="624" y="250">60%</text>
  <rect class="track" x="624" y="276" width="206" height="16" rx="8"/>
  <rect class="premium" x="624" y="276" width="124" height="16" rx="8"/>
  <text class="small" x="624" y="318">Datasets and trainers exist.</text>
  <text class="small" x="624" y="340">Current CNNs are diagnostic.</text>
  <text class="small" x="624" y="362">Needs no-REF 50 MP / 100 MP</text>
  <text class="small" x="624" y="384">gate pass.</text>

  <rect class="panel" x="882" y="122" width="258" height="270" rx="8"/>
  <rect class="recon" x="904" y="146" width="86" height="26" rx="13"/>
  <text class="badgeText" x="919" y="164">SHIP</text>
  <text class="label" x="904" y="206">Video reconstruction</text>
  <text class="num" x="904" y="250">100%</text>
  <rect class="track" x="904" y="276" width="206" height="16" rx="8"/>
  <rect class="recon" x="904" y="276" width="206" height="16" rx="8"/>
  <text class="small" x="904" y="318">Approved offline 4K cleanup.</text>
  <text class="small" x="904" y="340">Approved offline 8K SR.</text>
  <text class="small" x="904" y="362">Reopens only on failed receipt</text>
  <text class="small" x="904" y="384">or better replacement.</text>

  <rect class="panel" x="42" y="414" width="1098" height="116" rx="8"/>
  <rect class="research" x="64" y="438" width="124" height="26" rx="13"/>
  <text class="badgeText" x="82" y="456">RESEARCH</text>
  <text class="label" x="208" y="452">PSF / blur modeling is parked, not blocking the release.</text>
  <text class="small" x="208" y="476">Controlled high/low Mission 1 pairs and PSF-conditioned video SR are replacement research.</text>
  <text class="small" x="208" y="496">They replace the current path only after beating the locked baseline.</text>
  <text class="small" x="208" y="516">Requires the same .gvid, editable raw, ProRes, dashboard, timing, memory, and hash receipts.</text>
</svg>
