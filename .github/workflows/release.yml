name: Release

# Build, package and attach release tarballs whenever a `v*` tag is pushed.
#
# The user pushes a tag like `v2.0.0`; this workflow does NOT auto-tag.
#
# Outputs (per platform):
#   gpr-<version>-<platform>.tar.gz containing:
#     lib/*.a         (static libraries: vc5_encoder, vc5_common, vc5_decoder,
#                      gpr_sdk, dng_sdk, md5_lib, ...)
#     include/        (public headers, mirrored from source/lib)
#     bin/gpr_tools   (CLI)
#     README.md
#     AUTHORS.md      (LICENSE file is not present in this repo; AUTHORS.md
#                      carries attribution and the README has license info)
#     CONTRIBUTING.md
#
# Platforms:
#   ubuntu-latest             -> linux-x86_64
#   macos-latest              -> macos-arm64 (NEON on)
#   ubuntu-22.04-arm (if avail) -> linux-arm64 (NEON on)
#
# The Linux-arm64 runner is reported as "ubuntu-22.04-arm" in GitHub's public
# runner image lineup. We mark it continue-on-error so a temporary
# unavailability of the runner does not block the rest of the release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0). Only used for manual runs.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            experimental: false
          - os: macos-latest
            platform: macos-arm64
            experimental: false
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip leading 'v' for the filename portion.
          VERSION_NOV="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_nov=${VERSION_NOV}" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (file suffix: $VERSION_NOV)"

      - name: Configure & build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          if [ "$RUNNER_OS" = "Linux" ]; then
            make -j"$(nproc)"
          else
            make -j"$(sysctl -n hw.ncpu)"
          fi

      - name: Stage release tree
        id: stage
        run: |
          set -e
          STAGE="/tmp/gpr-${{ steps.version.outputs.version_nov }}-${{ matrix.platform }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/lib" "$STAGE/include" "$STAGE/bin"

          # Static libraries (cope with absent ones gracefully).
          for lib in vc5_encoder vc5_common vc5_decoder gpr_sdk dng_sdk md5_lib common expat_lib xmp_core; do
            archive="build/source/lib/${lib}/lib${lib}.a"
            if [ -f "$archive" ]; then
              cp "$archive" "$STAGE/lib/"
              echo "Staged $archive"
            else
              echo "Skipped (not built): $archive"
            fi
          done

          # Public headers — mirror each library's top-level headers.
          for libdir in source/lib/*/; do
            name="$(basename "$libdir")"
            dest="$STAGE/include/$name"
            mkdir -p "$dest"
            # Headers may live at top level or under nested dirs (dng_sdk etc.)
            find "$libdir" -maxdepth 3 -name "*.h" -print0 \
              | xargs -0 -I{} cp --parents {} "$dest/" 2>/dev/null \
              || find "$libdir" -maxdepth 3 -name "*.h" -exec cp {} "$dest/" \;
          done

          # CLI binary.
          if [ -x build/source/app/gpr_tools/gpr_tools ]; then
            cp build/source/app/gpr_tools/gpr_tools "$STAGE/bin/"
          fi

          # Top-level docs / license. LICENSE is absent; ship the closest
          # equivalents.
          for f in README.md AUTHORS.md CONTRIBUTING.md LICENSE LICENSE.md LICENSE.txt; do
            [ -f "$f" ] && cp "$f" "$STAGE/" || true
          done

          # Pack.
          TARBALL="/tmp/gpr-${{ steps.version.outputs.version_nov }}-${{ matrix.platform }}.tar.gz"
          tar -C "$(dirname "$STAGE")" -czf "$TARBALL" "$(basename "$STAGE")"
          ls -lh "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpr-${{ steps.version.outputs.version_nov }}-${{ matrix.platform }}
          path: ${{ steps.stage.outputs.tarball }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only publish when triggered by a real tag push, not workflow_dispatch.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p /tmp/release-flat
          # Each upload-artifact action created a subdirectory; the tarball
          # lives inside it. Move tarballs to a single dir for release upload.
          find /tmp/release-artifacts -type f -name "*.tar.gz" -exec mv {} /tmp/release-flat/ \;
          ls -lh /tmp/release-flat/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/release-flat/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
