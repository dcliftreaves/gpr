name: Labs Target Evidence

# Manual target/self-hosted workflow for evidence that hosted CI cannot prove.
# It is intentionally not triggered by push or pull_request because it needs a
# Pi 5 / Mission 1 stand-in runner, a local Bayer raw source, and external
# artifact storage. Detailed knobs are provided through config_json so the
# dispatch form stays small enough for GitHub to validate.

on:
  workflow_dispatch:
    inputs:
      raw_path:
        description: "Absolute path to the target-runner Bayer raw input"
        required: true
      profile:
        description: "Target defaults profile"
        required: true
        default: "mission1_native12_pi20"
        type: choice
        options:
          - mission1_native12_pi20
          - z8_50mp_strict24
          - custom_json
      config_json:
        description: "Optional JSON overrides for frames, role, dimensions, timing, and receipt labels"
        required: false
        default: "{}"

concurrency:
  group: labs-target-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pi5-sustained-capture:
    name: Pi 5 sustained .gvid capture
    runs-on: [self-hosted, Linux, ARM64, gpr-labs-pi5]
    timeout-minutes: 120

    env:
      GPR_EXTERNAL_ROOT: /Volumes/OWC_8TB/gpr_work
      GPR_ARTIFACT_ROOT: /Volumes/OWC_8TB/gpr_work/artifacts
      TMPDIR: /Volumes/OWC_8TB/gpr_work/tmp

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve dispatch config
        env:
          RAW_PATH_INPUT: ${{ inputs.raw_path }}
          PROFILE_INPUT: ${{ inputs.profile }}
          CONFIG_JSON_INPUT: ${{ inputs.config_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          cfg = {
              "raw_path": os.environ["RAW_PATH_INPUT"],
              "output_dir": "/Volumes/OWC_8TB/gpr_work/artifacts/labs_target_bench_self_hosted",
              "scratch_dir": "/Volumes/OWC_8TB/gpr_work/tmp",
              "source_provenance_root": ".",
              "frames": "1440",
              "target_fps": "20",
              "source_width": "4096",
              "source_height": "3072",
              "capture_width": "4096",
              "capture_height": "3072",
              "quality": "8",
              "wavelet_levels": "2",
              "no_decimate": "true",
              "col_decimate": "2",
              "row_decimate": "2",
              "pixel_format": "4",
              "direct_gvid": "true",
              "bench_binary": "bench_fused",
              "mission1_native12_fll2_profile": "true",
              "storage_target_name": "Lexar Professional SILVER PLUS SDXC/microSDXC UHS-I (128GB-1TB)",
              "storage_target_read_mbps": "205",
              "storage_target_write_mbps": "150",
              "storage_target_safety_margin": "0.90",
              "storage_target_note": "Published 128GB-1TB SILVER PLUS profile: 205 MB/s read, 150 MB/s write; 64GB microSD is 205/100.",
              "target_name": "Pi 5 stand-in",
              "target_role": "stand-in",
              "raw_source_kind": "file_standin",
              "frame_source": "file-backed Bayer stand-in",
              "memory_ownership": "synchronous submit; caller owns input through return",
              "write_path": "bench_fused target-bench .gvid path",
              "sensor_dma_executed": "false",
              "storage_handoff_executed": "false",
              "storage_medium": "target-bench filesystem stand-in",
              "storage_ownership": "OS/page-cache writeback; not camera firmware DMA",
              "blocker_cause": "camera hardware target not firmware-ready",
              "preview_target": "mission1_preview_4x_1024x768",
              "preview_limit": "0",
              "ui_path_executed": "false",
              "visual_checked": "false",
              "display_surface": "stand-in raw preview receipt output",
              "presentation_path": "off-camera preview decode receipt",
              "preview_buffer_ownership": "process-owned RGB output buffer",
              "preview_blocker_cause": "Mission 1 camera UI/display path not executed",
          }

          if os.environ.get("PROFILE_INPUT") == "z8_50mp_strict24":
              cfg.update({
                  "frames": "14400",
                  "target_fps": "24",
                  "source_width": "8280",
                  "source_height": "5520",
                  "capture_width": "8280",
                  "capture_height": "5520",
                  "quality": "3",
                  "no_decimate": "false",
                  "mission1_native12_fll2_profile": "false",
              })

          raw_config = os.environ.get("CONFIG_JSON_INPUT", "").strip()
          if raw_config:
              overrides = json.loads(raw_config)
              if not isinstance(overrides, dict):
                  raise SystemExit("config_json must be a JSON object")
              cfg.update({str(k): str(v) for k, v in overrides.items()})
          if not cfg["raw_path"]:
              raise SystemExit("raw_path is required")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as f:
              for key, value in cfg.items():
                  f.write(f"{key.upper()}<<__GPR_ENV__\n{value}\n__GPR_ENV__\n")
          PY

      - name: Prepare external directories
        id: prep
        run: |
          set -euo pipefail
          mkdir -p "$SCRATCH_DIR"
          OUT="${OUTPUT_DIR}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$OUT"
          echo "outdir=$OUT" >> "$GITHUB_OUTPUT"
          echo "Using output dir: $OUT"

      - name: Validate dispatch role flags
        run: |
          set -euo pipefail
          python3 tools/check_mission1_camera_dispatch_inputs.py \
            --target-role "$TARGET_ROLE" \
            --target-name "$TARGET_NAME" \
            --raw-source-kind "$RAW_SOURCE_KIND" \
            --sensor-dma-executed "$SENSOR_DMA_EXECUTED" \
            --storage-handoff-executed "$STORAGE_HANDOFF_EXECUTED" \
            --ui-path-executed "$UI_PATH_EXECUTED" \
            --visual-checked "$VISUAL_CHECKED" \
            --frame-source "$FRAME_SOURCE" \
            --write-path "$WRITE_PATH" \
            --storage-medium "$STORAGE_MEDIUM" \
            --storage-ownership "$STORAGE_OWNERSHIP" \
            --display-surface "$DISPLAY_SURFACE" \
            --presentation-path "$PRESENTATION_PATH" \
            --preview-buffer-ownership "$PREVIEW_BUFFER_OWNERSHIP"

      - name: Configure Release build
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build target binaries
        run: |
          set -euo pipefail
          cmake --build build --target bench_fused labs_encoder_bench_cli fused_decode_cli gvid_preview_rgb_cli -j"$(nproc)"

      - name: Resolve target binaries
        run: |
          set -euo pipefail
          if [ "$BENCH_BINARY" = "labs_encoder_bench_cli" ]; then
            bench_path="build/bin/labs_encoder_bench_cli"
            fallback_path="build/source/app/labs_encoder_bench_cli"
          else
            bench_path="build/bin/bench_fused"
            fallback_path="build/source/app/bench_fused/bench_fused"
          fi
          if [ ! -x "$bench_path" ]; then
            bench_path="$fallback_path"
          fi
          if [ ! -x "$bench_path" ]; then
            echo "$BENCH_BINARY binary not found at build/bin or source/app fallback" >&2
            exit 1
          fi
          labs_shim_path="build/bin/labs_encoder_bench_cli"
          if [ ! -x "$labs_shim_path" ]; then
            labs_shim_path="build/source/app/labs_encoder_bench_cli"
          fi
          decode_cli="build/bin/fused_decode_cli"
          if [ ! -x "$decode_cli" ]; then
            decode_cli="build/source/app/fused_decode_cli"
          fi
          preview_cli="build/bin/gvid_preview_rgb_cli"
          if [ ! -x "$preview_cli" ]; then
            preview_cli="build/source/app/gvid_preview_rgb_cli"
          fi
          {
            echo "BENCH_PATH=$bench_path"
            echo "LABS_SHIM_PATH=$labs_shim_path"
            echo "DECODE_CLI=$decode_cli"
            echo "PREVIEW_CLI=$preview_cli"
          } >> "$GITHUB_ENV"

      - name: Write target preflight receipt
        id: preflight
        run: |
          set -euo pipefail
          camera_flags=()
          if [ "$TARGET_ROLE" = "camera" ]; then
            camera_flags=(
              --camera-frame-source-ready
              --camera-storage-path-ready
              --camera-display-path-ready
            )
          fi
          receipt="${{ steps.prep.outputs.outdir }}/target_preflight_receipt.json"
          python3 tools/mission1_camera_target_preflight.py \
            --target-name "$TARGET_NAME" \
            --target-role "$TARGET_ROLE" \
            --repo-root "$PWD" \
            --raw "$RAW_PATH" \
            --output-dir "${{ steps.prep.outputs.outdir }}" \
            --scratch-dir "$SCRATCH_DIR" \
            --bench "$BENCH_PATH" \
            --labs-encoder-bench-cli "$LABS_SHIM_PATH" \
            --fused-decode-cli "$DECODE_CLI" \
            --preview-cli "$PREVIEW_CLI" \
            --source-width "$SOURCE_WIDTH" \
            --source-height "$SOURCE_HEIGHT" \
            --raw-source-kind "$RAW_SOURCE_KIND" \
            --frame-source "$FRAME_SOURCE" \
            --write-path "$WRITE_PATH" \
            --storage-medium "$STORAGE_MEDIUM" \
            --display-surface "$DISPLAY_SURFACE" \
            --presentation-path "$PRESENTATION_PATH" \
            --output-json "$receipt" \
            --require-ready \
            "${camera_flags[@]}"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Run strict Labs target bench
        id: bench
        run: |
          set -uo pipefail
          bench_args=(
            --bench "$BENCH_PATH"
            --raw "$RAW_PATH"
            --output-dir "${{ steps.prep.outputs.outdir }}"
            --frames "$FRAMES"
            --target-fps "$TARGET_FPS"
            --source-width "$SOURCE_WIDTH"
            --source-height "$SOURCE_HEIGHT"
            --capture-width "$CAPTURE_WIDTH"
            --capture-height "$CAPTURE_HEIGHT"
            --quality "$QUALITY"
            --wavelet-levels "$WAVELET_LEVELS"
            --pixel-format "$PIXEL_FORMAT"
            --storage-target-name "$STORAGE_TARGET_NAME"
            --storage-target-read-mbps "$STORAGE_TARGET_READ_MBPS"
            --storage-target-write-mbps "$STORAGE_TARGET_WRITE_MBPS"
            --storage-target-safety-margin "$STORAGE_TARGET_SAFETY_MARGIN"
            --storage-target-note "$STORAGE_TARGET_NOTE"
            --source-provenance-root "$SOURCE_PROVENANCE_ROOT"
          )
          if [ "$NO_DECIMATE" = "true" ]; then
            bench_args+=(--no-decimate)
          else
            bench_args+=(--col-decimate "$COL_DECIMATE" --row-decimate "$ROW_DECIMATE")
          fi
          if [ "$DIRECT_GVID" = "true" ]; then
            bench_args+=(--direct-gvid)
          fi
          if [ "$MISSION1_NATIVE12_FLL2_PROFILE" = "true" ]; then
            export FUSED_PIN=1
            export FUSED_PIN_P2=1
            export GPR_INCLUDE_LL=1
            export FUSED_RAW_LL=1
            export FUSED_LL_PREDICT=1
            export FUSED_LL_PREDICTOR=avg
            export FUSED_LL_RICE_KS=7,5,5,5
            export FUSED_LL_RICE_FAST=1
            export FUSED_LL_ASSUME_U16=1
            export FUSED_INLINE_TOKENIZE=1
            export FUSED_DEFER_RANS=1
            export GPR_BENCH_GVID_SCATTER=1
            export FUSED_REFERENCE_HORIZONTAL=1
            export FUSED_STRIPE_ROWS=384
            export GPR_INLINE_DENOISE_HARD=1
            export GPR_INLINE_DENOISE_T_LH=2
            export GPR_INLINE_DENOISE_T_HL=3
            export GPR_INLINE_DENOISE_T_HH=3
          fi
          python3 tools/run_labs_target_bench.py \
            "${bench_args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/labs_target_bench_stdout.txt"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate camera handoff receipt
        if: always()
        id: handoff
        run: |
          set -euo pipefail
          receipt="${{ steps.prep.outputs.outdir }}/labs_target_bench.json"
          output="${{ steps.prep.outputs.outdir }}/camera_handoff_receipt.json"
          if [ ! -f "$receipt" ]; then
            echo "status=missing-target-receipt" >> "$GITHUB_OUTPUT"
            echo "Missing target receipt: $receipt"
            exit 0
          fi
          sensor_flag=()
          if [ "$SENSOR_DMA_EXECUTED" = "true" ]; then
            sensor_flag=(--sensor-dma-executed)
          fi
          storage_flag=()
          if [ "$STORAGE_HANDOFF_EXECUTED" = "true" ]; then
            storage_flag=(--storage-handoff-executed)
          fi
          python3 tools/labs_target_to_camera_handoff_receipt.py "$receipt" \
            --output "$output" \
            --target-name "$TARGET_NAME" \
            --target-role "$TARGET_ROLE" \
            --target-fps "$TARGET_FPS" \
            --raw-source-kind "$RAW_SOURCE_KIND" \
            --frame-source "$FRAME_SOURCE" \
            --memory-ownership "$MEMORY_OWNERSHIP" \
            --write-path "$WRITE_PATH" \
            --storage-medium "$STORAGE_MEDIUM" \
            --storage-ownership "$STORAGE_OWNERSHIP" \
            --pixel-format "$PIXEL_FORMAT" \
            --blocker-cause "$BLOCKER_CAUSE" \
            "${storage_flag[@]}" \
            "${sensor_flag[@]}"
          python3 tools/check_labs_camera_handoff_receipt.py "$output"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Generate aggregate camera closure run
        if: always()
        id: closure
        run: |
          set -euo pipefail
          outdir="${{ steps.prep.outputs.outdir }}"
          target_receipt="$outdir/labs_target_bench.json"
          preflight_receipt="$outdir/target_preflight_receipt.json"
          handoff_receipt="$outdir/camera_handoff_receipt.json"
          closure_dir="$outdir/camera_closure_run"
          if [ ! -f "$target_receipt" ] || [ ! -f "$handoff_receipt" ]; then
            echo "status=missing-input-receipt" >> "$GITHUB_OUTPUT"
            echo "Missing target or handoff receipt for aggregate closure run"
            exit 0
          fi
          mkdir -p "$closure_dir"
          if [ -f "$preflight_receipt" ]; then
            cp "$preflight_receipt" "$closure_dir/target_preflight_receipt.json"
          fi
          sensor_flag=()
          if [ "$SENSOR_DMA_EXECUTED" = "true" ]; then
            sensor_flag=(--sensor-dma-executed)
          fi
          storage_flag=()
          if [ "$STORAGE_HANDOFF_EXECUTED" = "true" ]; then
            storage_flag=(--storage-handoff-executed)
          fi
          ui_flag=()
          if [ "$UI_PATH_EXECUTED" = "true" ]; then
            ui_flag=(--ui-path-executed)
          fi
          visual_flag=()
          if [ "$VISUAL_CHECKED" = "true" ]; then
            visual_flag=(--visual-checked)
          fi
          profile_flag=()
          if [ "$MISSION1_NATIVE12_FLL2_PROFILE" = "true" ]; then
            profile_flag=(--use-mission1-fll2-profile)
          fi
          no_decimate_flag=()
          decimate_args=()
          if [ "$NO_DECIMATE" = "true" ]; then
            no_decimate_flag=(--no-decimate)
          else
            decimate_args=(--col-decimate "$COL_DECIMATE" --row-decimate "$ROW_DECIMATE")
          fi
          direct_gvid_flag=()
          if [ "$DIRECT_GVID" = "true" ]; then
            direct_gvid_flag=(--direct-gvid)
          fi
          python3 tools/run_mission1_camera_closure.py \
            --output-dir "$closure_dir" \
            --target-bench-receipt "$target_receipt" \
            --target-preflight-receipt "$preflight_receipt" \
            --camera-handoff-receipt "$handoff_receipt" \
            --raw "$RAW_PATH" \
            --fused-decode-cli "$DECODE_CLI" \
            --target-name "$TARGET_NAME" \
            --target-role "$TARGET_ROLE" \
            --target-fps "$TARGET_FPS" \
            --raw-source-kind "$RAW_SOURCE_KIND" \
            --source-width "$SOURCE_WIDTH" \
            --source-height "$SOURCE_HEIGHT" \
            --capture-width "$CAPTURE_WIDTH" \
            --capture-height "$CAPTURE_HEIGHT" \
            --quality "$QUALITY" \
            --wavelet-levels "$WAVELET_LEVELS" \
            --pixel-format "$PIXEL_FORMAT" \
            --storage-target-name "$STORAGE_TARGET_NAME" \
            --storage-target-read-mbps "$STORAGE_TARGET_READ_MBPS" \
            --storage-target-write-mbps "$STORAGE_TARGET_WRITE_MBPS" \
            --storage-target-safety-margin "$STORAGE_TARGET_SAFETY_MARGIN" \
            --storage-target-note "$STORAGE_TARGET_NOTE" \
            --frame-source "$FRAME_SOURCE" \
            --memory-ownership "$MEMORY_OWNERSHIP" \
            --write-path "$WRITE_PATH" \
            --storage-medium "$STORAGE_MEDIUM" \
            --storage-ownership "$STORAGE_OWNERSHIP" \
            --handoff-blocker-cause "$BLOCKER_CAUSE" \
            --preview-target "$PREVIEW_TARGET" \
            --preview-limit "$PREVIEW_LIMIT" \
            --display-surface "$DISPLAY_SURFACE" \
            --presentation-path "$PRESENTATION_PATH" \
            --preview-buffer-ownership "$PREVIEW_BUFFER_OWNERSHIP" \
            --preview-blocker-cause "$PREVIEW_BLOCKER_CAUSE" \
            "${sensor_flag[@]}" \
            "${storage_flag[@]}" \
            "${ui_flag[@]}" \
            "${visual_flag[@]}" \
            "${profile_flag[@]}" \
            "${no_decimate_flag[@]}" \
            "${decimate_args[@]}" \
            "${direct_gvid_flag[@]}"
          python3 tools/check_mission1_camera_closure_run.py "$closure_dir/mission1_camera_closure_run.json"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Write target bench summary
        if: always()
        env:
          LABS_TARGET_OUTDIR: ${{ steps.prep.outputs.outdir }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          outdir = Path(os.environ["LABS_TARGET_OUTDIR"])
          receipt = outdir / "labs_target_bench.json"
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not receipt.exists():
              summary.write_text("## Labs Target Bench\n\nNo receipt was written.\n", encoding="utf-8")
              raise SystemExit(0)

          data = json.loads(receipt.read_text(encoding="utf-8"))
          timing = data.get("timing", {})
          capture = data.get("capture", {})
          verdict = data.get("verdict", {})
          gvid = data.get("gvid", {})
          handoff = outdir / "camera_handoff_receipt.json"
          preflight = outdir / "target_preflight_receipt.json"
          closure_run = outdir / "camera_closure_run" / "mission1_camera_closure_run.json"
          handoff_data = json.loads(handoff.read_text(encoding="utf-8")) if handoff.exists() else {}
          preflight_data = json.loads(preflight.read_text(encoding="utf-8")) if preflight.exists() else {}
          closure_data = json.loads(closure_run.read_text(encoding="utf-8")) if closure_run.exists() else {}
          rows = [
              ("bench_binary", os.environ.get("BENCH_BINARY")),
              ("target_preflight_receipt", str(preflight) if preflight.exists() else "missing"),
              ("receipt", str(receipt)),
              ("camera_handoff_receipt", str(handoff) if handoff.exists() else "missing"),
              ("mission1_camera_closure_run", str(closure_run) if closure_run.exists() else "missing"),
              ("frames", f"{capture.get('frames_written')}/{capture.get('frames_requested')}"),
              ("fps_median", timing.get("fps_median")),
              ("p95_ms", timing.get("p95_ms")),
              ("gvid_valid", verdict.get("gvid_valid")),
              ("no_drops", verdict.get("no_drops")),
              ("fps_target_met", verdict.get("fps_target_met")),
              ("target_preflight_ready", preflight_data.get("verdict", {}).get("target_preflight_ready")),
              ("firmware_ready", handoff_data.get("verdict", {}).get("firmware_ready")),
              ("closure_ready", closure_data.get("verdict", {}).get("production_ready")),
              ("interruption_recovery_proven", verdict.get("interruption_recovery_proven")),
              ("gvid_sha256", gvid.get("sha256")),
          ]
          text = ["## Labs Target Bench", "", "| field | value |", "|---|---|"]
          text += [f"| {k} | {v} |" for k, v in rows]
          text.append("")
          summary.write_text("\n".join(text), encoding="utf-8")
          PY

      - name: Upload compact target receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labs-target-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ steps.prep.outputs.outdir }}/target_preflight_receipt.json
            ${{ steps.prep.outputs.outdir }}/labs_target_bench.json
            ${{ steps.prep.outputs.outdir }}/camera_handoff_receipt.json
            ${{ steps.prep.outputs.outdir }}/camera_closure_run/mission1_camera_closure_run.json
            ${{ runner.temp }}/labs_target_bench_stdout.txt

      - name: Enforce target verdict
        run: |
          set -euo pipefail
          test "${{ steps.preflight.outputs.status }}" = "ok"
          test "${{ steps.bench.outputs.status }}" = "0"
          test "${{ steps.handoff.outputs.status }}" = "ok"
          test "${{ steps.closure.outputs.status }}" = "ok"
