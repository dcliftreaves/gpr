name: CI

# PR / branch test matrix for GPR 2.0.
#
# Builds the core static libraries and codec test binaries (band-level
# roundtrip, full-image roundtrip, container format, Labs encoder shim, edge
# sizes, pipeline simulator, encoder abort, full-chain end-to-end), then runs
# each against a synthesized Z8-shaped raw input frame.
#
# Platforms:
#   ubuntu-latest  -> x86_64 (NEON off)
#   macos-latest   -> arm64  (NEON on, automatically by CMakeLists.txt)
#
# Note: test_video_pipeline_sim.c uses mach/mach_time.h and only builds on
# macOS. It is skipped on Linux runners.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel in-progress runs for the same branch / PR when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
          - os: ubuntu-latest
            build_type: Debug
          - os: macos-latest
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sensitive-content guard
        run: python3 tools/test/check_sensitive_content.py

      - name: Sensitive-content history guard
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: python3 tools/test/check_sensitive_content.py --history

      - name: Repo artifact hygiene guard
        run: python3 tools/test/check_repo_artifact_hygiene.py

      - name: README media guard
        run: python3 tools/test/check_readme_media.py

      - name: README media guard regression
        run: python3 tools/test/test_check_readme_media.py

      - name: README product-pillar guard
        run: |
          python3 tools/test/check_readme_product_pillars.py
          python3 tools/test/test_check_readme_product_pillars.py
          python3 tools/test/check_high_level_goal_contract.py
          python3 tools/test/test_check_high_level_goal_contract.py

      - name: Product pillar receipt regression
        run: python3 tools/test/test_product_pillar_receipts.py

      - name: Product pillar helper regressions
        run: |
          python3 tools/test/test_build_camera_noise_calibration.py
          python3 tools/test/test_convert_darkframe_calibration_to_noise_sidecars.py
          python3 tools/test/test_build_camera_noise_coverage_audit.py
          python3 tools/test/test_build_camera_noise_runtime_policy.py
          python3 tools/test/test_build_bayer_phase_fixture_inventory.py
          python3 tools/test/test_build_stills_fixture_gap_plan.py
          python3 tools/test/test_extract_raw_bayer_u16.py
          python3 tools/test/test_build_stills_capture_request.py
          python3 tools/test/test_build_darkframe_provenance_review_packet.py
          python3 tools/test/test_check_darkframe_source_provenance.py
          python3 tools/test/test_check_raw_stills_noise_promotion_gate.py
          python3 tools/test/test_build_premium_still_sr_gate_receipt.py
          python3 tools/test/test_build_premium_still_sr_readiness.py
          python3 tools/test/test_build_premium_still_sr_fixture_manifest.py
          python3 tools/test/test_build_premium_still_sr_pairs.py
          python3 tools/test/test_build_premium_still_sr_candidate_dashboard.py
          python3 tools/test/test_build_premium_still_sr_hf_residual_targets.py
          python3 tools/test/test_audit_premium_still_sr_noise_clean_sweep.py
          python3 tools/test/test_check_premium_still_sr_noise_policy.py
          python3 tools/test/test_check_premium_still_sr_promotion_gate.py
          python3 tools/test/test_build_premium_still_sr_promotion_receipts.py
          python3 tools/test/test_check_premium_still_sr_candidate_preflight.py
          python3 tools/test/test_build_premium_still_sr_candidate_preflight_template.py
          python3 tools/test/test_build_premium_still_sr_launch_packet.py
          python3 tools/test/test_audit_premium_still_sr_source_evidence.py
          python3 tools/test/test_audit_premium_still_sr_raw_cfa_residual.py
          python3 tools/test/test_build_premium_still_sr_raw_cfa_residual_targets.py
          python3 tools/test/test_train_premium_still_sr_raw_cfa_residual.py
          python3 tools/test/test_build_premium_still_sr_raw_cfa_residual_gap.py
          python3 tools/test/test_analyze_premium_still_sr_hf_residual_bands.py
          python3 tools/test/test_train_premium_still_sr_hf_residual.py
          python3 tools/test/test_build_premium_still_sr_measured_degradation_teacher_source_audit.py
          python3 tools/test/test_build_premium_still_sr_exact_noop_receipt.py
          python3 tools/test/test_build_premium_still_sr_gate12_candidate_preflight.py
          python3 tools/test/test_check_premium_still_sr_smoke_gate_acceptance.py
          python3 tools/test/test_build_premium_still_sr_gate13_degradation_source_upgrade.py
          python3 tools/test/test_build_premium_still_sr_gate13_tail_safe_source_smoke.py
          python3 tools/test/test_build_premium_still_sr_gate13_feature_rich_tail_safe_source_smoke.py
          python3 tools/test/test_build_premium_still_sr_gate13_source_or_objective_revision.py
          python3 tools/test/test_build_premium_still_sr_gate14_candidate_intake.py
          python3 tools/test/test_build_premium_still_sr_gate14_selector_smoke.py
          python3 tools/test/test_build_bayer_resize_psf_receipt.py
          python3 tools/test/test_build_bayer_resize_psf_known_kernel_validation.py
          python3 tools/test/test_build_raw_video_psf_audit.py
          python3 tools/test/test_build_raw_video_psf_gap_plan.py
          python3 tools/test/test_build_raw_video_psf_next_experiment_contract.py
          python3 tools/test/test_build_mission1_native_psf_corpus_audit.py
          python3 tools/test/check_product_burndown_contract.py
          python3 tools/test/test_check_product_burndown_contract.py
          python3 tools/test/check_product_lock_ledger.py
          python3 tools/test/test_check_product_lock_ledger.py

      - name: Release evidence manifest guard
        run: python3 tools/test/check_release_evidence_manifest.py

      - name: Productization contract guard
        run: |
          python3 tools/check_productization_contracts.py
          python3 tools/test/check_production_capture_requirements.py
          python3 tools/test/test_check_production_capture_requirements.py
          python3 tools/test/test_build_production_capture_submission_template.py
          python3 tools/test/test_check_production_capture_submission.py
          python3 tools/test/test_gvid_conformance.py "${RUNNER_TEMP:-/tmp}/gvid_conformance"

      - name: Labs readiness guard
        run: python3 tools/test/check_labs_readiness.py

      - name: Mission 1 numbered-list readiness regression
        run: python3 tools/test/test_mission1_numbered_list_readiness.py

      - name: Mission 1 numbered-list closure plan regression
        run: python3 tools/test/test_mission1_numbered_list_closure_plan.py

      - name: Mission 1 8K SR promotion receipt regression
        run: python3 tools/test/test_mission1_8k_sr_production_promotion.py

      - name: Mission 1 CNN closure regression
        run: python3 tools/test/test_check_mission1_cnn_closure.py

      - name: Mission 1 CNN closure guard
        run: python3 tools/check_mission1_cnn_closure.py

      - name: Install Python image dependency
        # The visual-review package regression builds tiny contact-sheet
        # fixtures with Pillow before the heavier codec test dependencies are
        # installed below.
        run: python3 -m pip install pillow --break-system-packages

      - name: Mission 1 8K SR visual review regression
        run: python3 tools/test/test_build_mission1_8k_sr_visual_review.py

      - name: Mission 1 8K SR visual signoff regression
        run: python3 tools/test/test_build_mission1_8k_sr_visual_signoff.py

      - name: CNN product scorecard regression
        run: |
          python3 tools/test/test_build_cnn_product_scorecard.py
          python3 tools/test/test_build_cnn_dataset_inventory.py

      - name: Mission 1 camera dispatch input regression
        run: python3 tools/test/test_mission1_camera_dispatch_inputs.py

      - name: Mission 1 camera closure package regression
        run: python3 tools/test/test_mission1_camera_closure_package.py

      - name: Mission 1 camera hardware audit regression
        run: python3 tools/test/test_mission1_camera_hardware_audit.py

      - name: Mission 1 camera source probe regression
        run: python3 tools/test/test_mission1_camera_source_probe.py

      - name: Mission 1 DMA source simulator regression
        run: python3 tools/test/test_mission1_dma_source_sim.py

      - name: Mission 1 camera target preflight regression
        run: python3 tools/test/test_mission1_camera_target_preflight.py

      - name: Mission 1 target closure collector regression
        run: python3 tools/test/test_collect_mission1_target_closure.py

      - name: Mission 1 target closure package regression
        run: python3 tools/test/test_run_mission1_target_closure_package.py

      - name: Mission 1 remote closure launch regression
        run: python3 tools/test/test_run_mission1_remote_closure_package.py

      - name: Mission 1 camera closure runner regression
        run: python3 tools/test/test_run_mission1_camera_closure.py

      - name: Mission 1 camera closure-run validator regression
        run: python3 tools/test/test_mission1_camera_closure_run.py

      - name: Labs target receipt guard
        # Hosted CI validates the manifest contract. If external target
        # receipts are mounted, the same checker validates receipt-derived
        # metrics and the current blocked/pass state from the JSON evidence.
        env:
          GPR_EXTERNAL_ROOT: ${{ runner.temp }}/gpr_work
        run: python3 tools/test/check_labs_target_receipts.py

      - name: Fused quality table guard
        run: python3 tools/test/check_fused_quality_tables.py

      - name: Production artifact inventory
        # Inventory mode exits 0 when private external artifacts are absent,
        # so hosted CI can exercise the artifact resolver and registry hashing
        # path without mounting /Volumes/OWC_8TB/gpr_work. Release promotion
        # still requires the strict local check.
        run: |
          python3 tools/verify_production_artifacts.py
          python3 tools/test/test_verify_production_artifacts.py

      - name: Release manifest artifact inventory
        # Inventory mode exits 0 when external dashboards/media/checkpoints are
        # absent, but still verifies that manifest artifact resolution remains
        # runnable on every CI job. Release promotion requires --strict locally.
        run: |
          python3 tools/verify_release_manifest_artifacts.py --summary
          python3 tools/test/test_verify_release_manifest_artifacts.py

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # cmake & clang come with the macOS runner image; just sanity check.
          cmake --version
          clang --version
          # GNU coreutils for `timeout` (macOS ships BSD utils, no timeout).
          # Add the gnubin dir to PATH so `timeout` resolves to gtimeout
          # without per-call renaming.
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        # numpy: synthesize test fixtures and compute PSNR.
        # rawpy : open DNG files produced by gpr_tools and read raw_image.
        # pillow: build compact visual-review package fixtures.
        # Used by both the fixture generator below and the
        # still-quality CI step at the bottom of this job.
        # --break-system-packages is needed on macOS-14 runners (PEP 668
        # marks the system Python as externally-managed; pip refuses to
        # install into it without the flag). It's a no-op on Linux where
        # the runner Python is already user-writeable.
        run: |
          python3 -m pip install numpy rawpy pillow --break-system-packages

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build libraries
        run: |
          cd build
          # The 7 test binaries link directly against vc5_encoder / vc5_common.
          # gpr_sdk / dng_sdk / md5_lib are part of the normal target set and
          # build cheaply, so we just build the default `all` target rather
          # than enumerate each one (matches how devs build locally).
          if [ "$RUNNER_OS" = "Linux" ]; then
            make -j"$(nproc)"
          else
            make -j"$(sysctl -n hw.ncpu)"
          fi

      - name: Generate synthetic Z8 raw input
        # Tests default-open /tmp/Z8_ISO64.raw at 8280x5520 (RGGB16, 2 B/px).
        # Real fixture is 91,411,200 bytes. We write a structured pattern
        # (smooth gradient + mild deterministic noise) — pure white noise
        # would exercise the rANS encoder at its theoretical worst case
        # and can hit the walker's `0xFFFFFFFF` pseudo-magic; structured
        # data is closer to real photographic content and exercises every
        # code path without triggering pathological-input edge cases.
        run: |
          python3 - <<'PY'
          import os
          W, H = 8280, 5520
          # Numpy is preinstalled on GH runners; falls back to pure python.
          try:
              import numpy as np
              HAVE_NUMPY = True
          except ImportError:
              HAVE_NUMPY = False
          for name, seed, noise_amp in (("Z8_ISO64.raw", 42, 50),
                                         ("Z8_ISO22800.raw", 4242, 400)):
              path = f"/tmp/{name}"
              if HAVE_NUMPY:
                  rng = np.random.default_rng(seed)
                  # Smooth radial gradient ~ [2000, 14000] (14-bit-ish midtones).
                  yy, xx = np.mgrid[0:H, 0:W].astype(np.float32)
                  r = np.hypot(xx - W/2, yy - H/2) / np.hypot(W/2, H/2)
                  base = 2000 + (1.0 - r) * 12000
                  noise = rng.integers(-noise_amp, noise_amp + 1,
                                        size=(H, W), dtype=np.int32)
                  out = np.clip(base.astype(np.int32) + noise, 0, 16383)
                  out.astype('<u2').tofile(path)
              else:
                  import random, struct
                  rng = random.Random(seed)
                  with open(path, "wb") as f:
                      for y in range(H):
                          row = bytearray(W * 2)
                          for x in range(W):
                              r = ((x - W/2) ** 2 + (y - H/2) ** 2) ** 0.5
                              r /= ((W/2) ** 2 + (H/2) ** 2) ** 0.5
                              v = int(2000 + (1 - r) * 12000) + rng.randint(-noise_amp, noise_amp)
                              v = max(0, min(16383, v))
                              row[2*x] = v & 0xFF
                              row[2*x + 1] = (v >> 8) & 0xFF
                          f.write(row)
              sz = os.path.getsize(path)
              print(f"{path}: {sz} bytes (expected {W*H*2})")
              assert sz == W * H * 2, "size mismatch"
          PY

      - name: Build test binaries
        run: |
          set -e
          mkdir -p /tmp/gpr-tests

          # Common link line for the codec tests. All of them depend on
          # libvc5_encoder.a and libvc5_common.a. Both archives are required
          # because jans_decode_band_x4 lives in vc5_common.
          ENCODER_LIB="build/source/lib/vc5_encoder/libvc5_encoder.a"
          COMMON_LIB="build/source/lib/vc5_common/libvc5_common.a"
          LDLIBS="-lpthread -lm"

          # Build each test. We use clang on both platforms (Linux job
          # installed it explicitly; macOS ships with it). -O2 matches the
          # build line documented in each test source.
          build_test() {
            local name="$1"
            echo "::group::Build $name"
            clang -O2 -o "/tmp/gpr-tests/$name" "source/app/$name.c" \
              "$ENCODER_LIB" "$COMMON_LIB" $LDLIBS
            echo "::endgroup::"
          }

          build_test test_video_roundtrip
          build_test test_video_full_roundtrip
          build_test test_video_format
          build_test test_labs_encoder_api
          build_test test_edge_sizes
          build_test test_video_encoder_abort
          build_test test_video_full_chain

          # test_video_pipeline_sim uses mach/mach_time.h -> macOS only.
          if [ "$RUNNER_OS" = "macOS" ]; then
            build_test test_video_pipeline_sim
          else
            echo "Skipping test_video_pipeline_sim build (mach_time.h is macOS-only)."
          fi

          # test_gpr_polish — CoreML wrapper smoke test, macOS only. Links
          # against libgpr_polish.a (built when GPR_POLISH=ON, default on
          # Apple) plus the CoreML / Foundation frameworks and libc++ (the
          # library is Objective-C++).
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "::group::Build test_gpr_polish"
            clang -O2 -I source/lib/gpr_polish \
              -o /tmp/gpr-tests/test_gpr_polish source/app/test_gpr_polish.c \
              build/source/lib/gpr_polish/libgpr_polish.a \
              -framework CoreML -framework Foundation -lc++
            echo "::endgroup::"
          fi

      - name: Run test_video_format
        run: timeout 60 /tmp/gpr-tests/test_video_format

      - name: Run test_labs_encoder_api
        run: timeout 60 /tmp/gpr-tests/test_labs_encoder_api

      - name: Run test_video_encoder_abort
        run: timeout 60 /tmp/gpr-tests/test_video_encoder_abort

      - name: Run fused context env capture smoke
        run: timeout 60 bash tools/test/test_fused_context_env_capture.sh

      - name: Run bench_fused quality env smoke
        run: timeout 60 bash tools/test/test_bench_fused_quality_env.sh

      - name: Run bench_fused stream source smoke
        run: timeout 60 bash tools/test/test_bench_fused_stream_source.sh

      - name: Run test_edge_sizes
        run: timeout 120 /tmp/gpr-tests/test_edge_sizes

      - name: Run test_video_full_chain
        run: timeout 120 /tmp/gpr-tests/test_video_full_chain

      - name: Run fused full Bayer encode/decode roundtrip
        # Public decoder coverage for the current full-image path. The older
        # test_video_full_roundtrip step below uses a private wavelet oracle
        # that no longer matches the current fused layout; this step verifies
        # the production contract directly: encode with LL present, decode
        # with gpr_decode_fused(), and assert full-res PSNR.
        env:
          GPR_INCLUDE_LL: "1"
          FUSED_INLINE_TOKENIZE: "0"
        run: timeout 180 build/bin/test_fused_roundtrip /tmp/Z8_ISO64.raw 8280 5520

      - name: Run test_video_roundtrip
        # Uses /tmp/Z8_ISO64.raw and /tmp/Z8_ISO22800.raw generated above.
        # FUSED_INLINE_TOKENIZE=0 forces split-pass mode. The encoder's
        # default chooses inline mode on ≤6-core hosts (the typical CI
        # runner) — inline-mode bands are not currently bit-compatible
        # with jans_decode_band_x4's standalone decode path used by this
        # test. Split-pass produces the legacy per-band header format
        # the test exercises. Encoder→decoder coverage of inline mode
        # is the job of test_fused_decode_roundtrip.
        env:
          FUSED_INLINE_TOKENIZE: "0"
        run: timeout 180 /tmp/gpr-tests/test_video_roundtrip

      - name: Run test_video_full_roundtrip
        # Temporarily disabled: this test has its own forward-wavelet
        # reference implementation in source/app/ that bit-compares against
        # the encoder's bands. The fused encoder rewrite on this branch
        # changed the wavelet layout (single-level + LL by default; legacy
        # was 2-level), so the test's oracle no longer matches and reports
        # ~7 dB PSNR vs the 50 dB threshold. The encoder→decoder roundtrip
        # is still covered by test_fused_decode_roundtrip (which uses the
        # decoder lib instead of a private oracle).
        #
        # Re-enable after rewriting the test to either (a) use
        # gpr_decode_fused() to verify decoder→Bayer match input, or
        # (b) update the oracle to single-level + LL math.
        if: false
        run: timeout 600 /tmp/gpr-tests/test_video_full_roundtrip

      - name: Run test_video_pipeline_sim (macOS only)
        if: runner.os == 'macOS'
        # 10 frames, 24 fps, 150 MB/s, 0 ms GC stall, 1 s GC period, ring=3.
        run: |
          timeout 180 /tmp/gpr-tests/test_video_pipeline_sim \
            /tmp/Z8_ISO64.raw 8280 5520 4 3 10 24.0 150.0 0.0 1.0

      - name: Run test_gpr_polish (macOS only)
        if: runner.os == 'macOS'
        # No model path: exercises the create(NULL)/available() smoke. A
        # model-bearing run requires shipping a .mlpackage which we don't
        # do in-repo today; the full apply path is exercised locally.
        run: timeout 30 /tmp/gpr-tests/test_gpr_polish

      - name: Run still-image quality regression (DNG roundtrip PSNR)
        # Synthetic radial-gradient fixtures at canonical sizes/bit-depths,
        # designed to push 3-level wavelet LL coefficients past 32767 so
        # decoder int16/uint16 sign-extension bugs surface as catastrophic
        # PSNR drops. Catches the class of regression that previously broke
        # 14-bit Z8 decode (PSNR 14 dB) while leaving 16-bit X2D bit-exact.
        env:
          BUILD_DIR: build
        run: timeout 240 source/app/test_still_quality_corpus.sh

      - name: Run still-image quality matrix (15-cell)
        # Extends the 5-case corpus above with full coverage of:
        #   bit depths     (rggb12, rggb12p, rggb14, rggb16, gbrg16)
        #   quality presets (0 = Low, 3 = FS1, 8 = FS5)
        #   resolutions    (1024², 12 MP, 23 MP HERO10, 50 MP Z8, 100 MP X2D)
        # Each cell's baseline PSNR is locked from a clean run and checked
        # with ~2 dB tolerance below that baseline. Pure synthesis — no
        # committed media. Runs on both Linux and macOS.
        env:
          BUILD_DIR: build
        run: timeout 480 tools/test/test_still_matrix.sh

      - name: Run capability regression (locked criteria — MET/EXCEEDED/FAILED)
        # Walks every claimed capability, measures encode_ms, decode_ms,
        # compression ratio, and roundtrip PSNR per cell, and asserts each
        # one against its stated criterion. Writes docs/CAPABILITIES.md
        # as the canonical capability×measurement table. Fails CI if any
        # cell breaks its criterion (FAILED). On Linux runners FAST=1 skips
        # the 23/50/100 MP cells to keep wall-clock under 2 min.
        # GPR_TIMING_TOLERANCE relaxes ms criteria for hosted-runner variance.
        # On hosted macOS, also sample the large still cells multiple times
        # and keep the best codec wall time. That avoids failing the release
        # job on a single cold 50 MP process/filesystem hiccup while preserving
        # strict quality, size, and local release timing receipts.
        # Debug builds can hit ~4x Release latency. Hosted macOS Release runners
        # now resolve to macOS 26 arm64 images and still show
        # scheduling/filesystem jitter against M3-Max-locked timing ceilings,
        # especially on large full-frame cells. Quality and size criteria stay
        # strict.
        env:
          BUILD_DIR: build
          FAST: ${{ runner.os == 'Linux' && '1' || '0' }}
          ARTIFACT_DIR: /tmp/gpr-capabilities
          GPR_TIMING_TOLERANCE: ${{ matrix.build_type == 'Debug' && '4.0' || runner.os == 'macOS' && '4.0' || '1.0' }}
          GPR_TIMING_SAMPLE_MAX_PIXELS: ${{ runner.os == 'macOS' && '120000000' || '12192768' }}
        run: timeout 600 python3 tools/test/test_capabilities.py

      - name: Run raw target helper regression
        # Verifies that raw-resolution helper code preserves the CFA plane
        # contract for 2K/0.5x Bayer downsampling and that the bounded
        # live PREVIEW display policy stays tied to the 2K L2 HH target.
        run: |
          python3 tools/test/test_raw_resolution_targets.py
          python3 tools/test/test_bayer_resample.py

      - name: Run live PREVIEW policy materialization
        # Cheap standalone contract check for the committed live-preview
        # source policy. This is also imported by the raw target helper, but
        # running it directly keeps the CI-safe release-check subset exact.
        run: python3 tools/live_preview_policy.py

      - name: Run GVID pack and metadata smokes
        # Cheap container-contract checks for the neutral .gvid wire header,
        # metadata sidecar validation, runtime dispatch generation, and
        # negative duplicate/mismatched frame-tag cases. The Labs bundle and
        # target-bench smokes verify portable artifact and receipt schemas
        # without committing media or claiming target hardware evidence. Direct
        # gpr2prores render-input smoke remains a macOS dev-host check because
        # it needs the Objective-C renderer binary plus local media fixtures.
        env:
          GPR_EXTERNAL_ROOT: ${{ runner.temp }}/gpr_work
          GPR_TMPDIR: ${{ runner.temp }}/gpr_work/tmp
        run: |
          bash tools/test/test_gvid_pack.sh
          bash tools/test/test_gvid_metadata.sh
          bash tools/test/test_labs_bundle_builder.sh
          bash tools/test/test_labs_bundle_verify.sh
          bash tools/test/test_labs_target_bench_smoke.sh
          BUILD_DIR=build bash tools/test/test_labs_encoder_bench_cli.sh
          bash tools/test/test_analyze_fused_payload.sh
          bash tools/test/test_render_gvid_sr_registry.sh
          python3 tools/test/test_native12_sr8k_readiness_audit.py
          python3 tools/test/test_mission1_sr_production_gap_report.py
          python3 tools/test/test_decide_mission1_sr_promotion.py
          python3 tools/test/test_run_mission1_sr_guarded_experiment.py
          python3 tools/test/test_mission1_native12_sr_frontier_summary.py
          python3 tools/test/test_mission1_native12_frontier_summary.py
          python3 tools/test/test_mission1_write_contention_summary.py
          python3 tools/test/test_mission1_strict24_gap_report.py
          python3 tools/test/test_mission1_strict24_probe_matrix_summary.py
          python3 tools/test/test_mission1_sr_pair_codec_profiles.py
          GPR_TOOLS=build/source/app/gpr_tools/gpr_tools bash tools/test/test_gpr_tools_raw_gpr_roundtrip.sh
          bash tools/test/test_labs_camera_handoff_receipt.sh
          bash tools/test/test_labs_preview_ui_receipt.sh
          bash tools/test/test_build_labs_preview_ui_receipt.sh
          bash tools/test/test_mission1_4k_cleanup_signoff_receipt.sh
          bash tools/test/test_build_mission1_4k_cleanup_signoff_receipt.sh
          bash tools/test/test_mission1_native12_fll2_t2_profile.sh

      - name: Registry consistency check
        # Surfaces unknown refs, still/video mode mismatches, use_for
        # misclassifications, and checkpoint-hash drift in pipelines/registry.json.
        run: python3 tests/quality_gates/check_registry_consistency.py

      - name: Ship pipeline receipt audit
        # Verifies every registry role tagged ship-* has an exact committed
        # PASS run receipt, current gate hash, and claim receipt.
        run: python3 tests/quality_gates/audit_ship_pipelines.py --strict

      - name: Run CNN regression (macOS only, dev-host deps)
        if: runner.os == 'macOS'
        # Skips gracefully when torch / rawpy / cv2 / the dering_proto_v2
        # checkpoints directory are not present on the runner. Stock GH
        # Actions macOS runners do not ship these, so on the public CI
        # this is effectively a no-op smoke until a self-hosted dev-box
        # runner is wired up. The script's prerequisite check produces a
        # clean "SKIP" exit-0 in that case.
        run: timeout 300 python3 tools/test/test_cnn_regression.py

      - name: Run video pipeline matrix (macOS only)
        if: runner.os == 'macOS'
        # Exercises gpr2prores playback across (CNN variant × out
        # resolution × demosaic backend). Cells whose weight directory is
        # missing are reported SKIP, so on stock GH Actions runners (no
        # dering_proto_v2 weights) most cells will skip. Cells that do
        # run must exit 0 — no fps threshold yet. The gpr2prores binary
        # is not built by this workflow today; the step short-circuits if
        # it's not present so the rest of the job still passes.
        env:
          BUILD_DIR: build
          FAST: "1"
        run: |
          if [ -x tools/gpr2prores/gpr2prores ]; then
            timeout 300 tools/test/test_video_pipeline.sh
          else
            echo "SKIP — gpr2prores binary not built in this CI workflow"
          fi

      - name: Run sustained-fps regression (macOS only)
        # Protects the 26+ fps × UHD playback win from PR #10 + #11 + #13.
        # Builds a 24-frame synth fixture and asserts:
        #   with BIBO_1x CNN: ≥ 20 fps; without CNN: ≥ 22 fps.
        # Skips cleanly on Linux (gpr2prores is macOS-only) and on macOS
        # when the BIBO_1x metal weights dir isn't present (stock GH
        # Actions runners don't ship the dering_proto_v2 weights).
        # See tools/test/test_sustained_playback.sh for env knobs.
        if: runner.os == 'macOS'
        env:
          BUILD_DIR: build
        run: |
          if [ -x tools/gpr2prores/gpr2prores ]; then
            timeout 240 tools/test/test_sustained_playback.sh
          else
            echo "SKIP — gpr2prores binary not built in this CI workflow"
          fi
